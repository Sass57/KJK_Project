<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="scroll-top"></div>
<div id="app">

<div class="plaque">
  <div class="plaque-title">A Tűzhegy Varázslója</div>
  <div class="plaque-sub">Steve Jackson &amp; Ian Livingstone · 1982</div>
</div>

<div id="stats-bar" style="display:none">
  <div class="stat skill">
    <span class="stat-label">Ügyesség</span>
    <div class="stat-bar-wrap">
      <span class="stat-val" id="skill-val">—</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill skill-bar" id="skill-bar" style="width:0%"></div></div>
    </div>
  </div>
  <div class="stat stamina">
    <span class="stat-label">Életerő</span>
    <div class="stat-bar-wrap">
      <span class="stat-val" id="stamina-val">—</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill stamina-bar" id="stamina-bar" style="width:0%"></div></div>
    </div>
  </div>
  <div class="stat luck">
    <span class="stat-label">Szerencse</span>
    <div class="stat-bar-wrap">
      <span class="stat-val" id="luck-val">—</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill luck-bar" id="luck-bar" style="width:0%"></div></div>
    </div>
  </div>
  <div class="stat">
    <span class="stat-label">Élelem</span>
    <div id="food-icons"></div>
    <div id="food-icons"></div>
  </div>
  <div class="stat para">
    <span class="stat-label">Szakasz</span>
    <span class="stat-val" id="para-num-stat">—</span>
  </div>
</div>
  </div>
</body>
</html>
